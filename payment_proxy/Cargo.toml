[package]
name = "payment_proxy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils", "ed25519-dalek"]

[dependencies]
soroban-sdk = "20.0.0"
ed25519-dalek = { version = "2", optional = true }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
