[package]
name = "payment_router"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "20.0.0"
derive_arbitrary = "=1.3.2"

[patch.crates-io]
ethnum = { path = "etnum-patch" }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"
proptest = "1.5.0"
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[package.metadata]
strict-clippy = true
clippy-note = "CI enforces 'cargo clippy --all-targets --all-features - -D warnings'"
